<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="梦澄博客">
  <!--
    站点图标：紫粉渐变的菱形星芒。
    渐变色值取自原设计图，与 theme.css 里的 accent 变量保持一致。

    注意：注释里不能出现连续的连字符，XML 规范禁止（会导致
    图片加载失败，表现为破图，但控制台无报错）。
  -->
  <defs>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7C24C4"/>
      <stop offset="100%" stop-color="#B32A9F"/>
    </linearGradient>
  </defs>

  <!-- 圆角方块底 -->
  <rect width="64" height="64" rx="14" fill="url(#mark)"/>

  <!--
    圆角菱形外框。用 path 而非 rect，是为了让四个角平滑过渡 ——
    原图的菱形不是尖角，尖角在 16px 的 favicon 尺寸下会显得尖锐。
  -->
  <path
    d="M32 10.5
       C36 10.5 53.5 28 53.5 32
       C53.5 36 36 53.5 32 53.5
       C28 53.5 10.5 36 10.5 32
       C10.5 28 28 10.5 32 10.5 Z"
    fill="none"
    stroke="#FFFFFF"
    stroke-opacity="0.92"
    stroke-width="3.2"
  />

  <!-- 内部四角星芒：四枚弧形三角向中心收拢 -->
  <path
    d="M32 18
       C33.5 25 39 30.5 46 32
       C39 33.5 33.5 39 32 46
       C30.5 39 25 33.5 18 32
       C25 30.5 30.5 25 32 18 Z"
    fill="#FFFFFF"
    fill-opacity="0.92"
  />
</svg>
